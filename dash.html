<script>
/* Home Screen: the data key lives only in the URL hash (#d=...) and this device's storage, never in the repo.
   iOS home-screen apps get their own storage, so the saved icon must carry the key in its URL:
   1) keep #d=KEY in the address bar (re-added from storage if missing), so "Add to Home Screen" saves it;
   2) swap the static manifest for an in-memory one whose start_url includes the same #d=KEY. */
(function () {
  var re = /^#d=([A-Za-z0-9_-]{32,})/, m = location.hash.match(re), k = m ? m[1] : null;
  try { if (k) localStorage.setItem("dataPath", k); else k = localStorage.getItem("dataPath"); } catch (e) { }
  window.DESK_KEY = k;
  addEventListener("hashchange", function () { var n = location.hash.match(re); if (n && n[1] !== k) location.reload(); });
  window.deskHash = function (floor) { return (k ? "#d=" + k : "") + (floor ? (k ? "&" : "#") + "floor" : ""); };
  if (k && !m) try { history.replaceState(null, "", location.pathname + location.search + window.deskHash(/(^#|&)floor\b/.test(location.hash))); } catch (e) { }
  if (!k) return;
  var dir = location.origin + location.pathname.replace(/[^/]*$/, ""), page = location.origin + location.pathname;
  var mf = { id: dir + "dash.html", name: "Desk", short_name: "Desk", start_url: page + "#d=" + k, scope: dir, display: "standalone",
    orientation: "portrait", background_color: "#000000", theme_color: "#000000",
    icons: [180, 192, 512].map(function (n) { return { src: dir + "icons/dash-" + n + ".png", sizes: n + "x" + n, type: "image/png" }; }) };
  try { document.getElementById("mf").href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: "application/manifest+json" })); } catch (e) { }
})();
</script>
