<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">
<meta name="referrer" content="no-referrer">
<title>HIGHLIKEMYPJ DESK · live</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="dash.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">◆</span> HIGHLIKEMYPJ DESK <span id="mode" class="badge">…</span></div>
  <div class="meta"><span id="feed" class="feed">connecting</span><a class="home" href="index.html">APP ›</a><span id="clock" class="clock">--:--:-- ET</span></div>
</header>
<div id="err" class="err" hidden></div>
<section class="cards" id="cards"></section>
<section class="panel graphp">
  <div class="ph"><span>AGENT FLOW · live handoffs</span><span id="flowinfo" class="dim"></span></div>
  <div class="graphwrap"><canvas id="graph"></canvas><div id="bubbles"></div></div>
</section>
<section class="panel balp">
  <div class="ph"><span id="ballabel">BALANCE</span><span id="balsub" class="dim"></span></div>
  <div class="balwrap"><canvas id="bal"></canvas><div class="bignum" id="bignum">--</div><div class="balnote" id="balnote"></div></div>
</section>
<section class="bottom">
  <div class="panel coinp">
    <div class="ph"><span id="coinlabel">COIN</span><a id="coinlink" class="dim" target="_blank" rel="noopener"></a></div>
    <div class="coinwrap" id="coinwrap"></div>
    <div class="ph sub"><span>OPEN POSITIONS</span><span id="poscount" class="dim"></span></div>
    <div id="positions"></div>
  </div>
  <div class="panel termp">
    <div class="ph"><span>terminal.py</span><span class="dim" id="termcount"></span></div>
    <div class="term" id="term"></div>
  </div>
</section>
<footer class="foot dim" id="foot"></footer>
<script src="feed.js"></script>
<script src="dash.js"></script>
</body>
</html>
